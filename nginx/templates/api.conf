# api.trade-logx.com -- the public /v1 API (automation-hub/routers/public_api.py).
# Rendered only once its own certificate exists (see entrypoint/10-render-config.sh),
# so nginx never refuses to start over a missing file. Until then the default
# port-80 server answers the ACME challenge for this name, which is what lets
# certbot issue the certificate in the first place.
server {
  listen 443 ssl;
  http2 on;
  server_name api.trade-logx.com;
  server_tokens off;
  client_max_body_size 256k;
  proxy_read_timeout 60s;
  ssl_certificate /etc/letsencrypt/live/api.trade-logx.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.trade-logx.com/privkey.pem;
  # API clients have no legacy-browser or webhook-sender constraints: TLS 1.3 only.
  ssl_protocols TLSv1.3;
  ssl_session_cache shared:SSL_API:10m;
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header X-Content-Type-Options;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /v1/ {
    proxy_pass http://app:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location = /status {
    proxy_pass http://app:8000/status/public;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
  # Nothing else of the app -- sign-in, dashboard, control endpoints -- is
  # reachable on this name.
  location / {
    default_type application/json;
    return 404 '{"error":{"code":"not_found","message":"The API lives under /v1/. See https://trade-logx.com/api"}}';
  }
}
