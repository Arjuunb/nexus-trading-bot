server {
  listen 80;
  server_name trade-logx.com www.trade-logx.com;
  server_tokens off;
  location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; try_files $uri =404; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name trade-logx.com www.trade-logx.com;
  server_tokens off;
  client_max_body_size 2m;

  # Compress text on the way out: the dashboard's JavaScript shrinks to about a
  # third. JSON API responses are deliberately left out -- compressing responses
  # that can mix secrets with request-controlled text invites BREACH-style
  # attacks. HTML (always compressed when gzip is on) carries no secret that
  # stays constant between responses.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript image/svg+xml text/plain
             application/manifest+json application/xml;
  proxy_read_timeout 90s;
  ssl_certificate /etc/letsencrypt/live/trade-logx.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/trade-logx.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  # nginx owns these four so they are also on responses nginx makes itself
  # (a 502 while the app restarts). The app's copies are dropped to avoid
  # sending each header twice. The Content-Security-Policy carries a per-response
  # nonce and the other hardening headers come from the app (app.py).
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://app:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /events/stream {
    proxy_pass http://app:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
  }
}
