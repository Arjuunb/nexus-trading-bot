# No DNS, firewall or existing certificate change. New isolated loopback ingress.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /run/fixture/tls.crt;
        ssl_certificate_key /run/fixture/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Only authentication may submit POST. Financial/trading routes are
        # absent from this ingress allowlist, independent of browser controls.
        location = /login {
            limit_except GET POST { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ~ ^/auth/(session|refresh|logout|two-factor)$ {
            limit_except GET POST { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ~ ^/(health$|version$|app(?:/|$)|assets/|api/v2/strategy-intelligence/) {
            limit_except GET { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = / {
            limit_except GET { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / { return 403; }
    }
}
