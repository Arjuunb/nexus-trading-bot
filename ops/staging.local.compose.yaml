# OPT-IN DISPOSABLE LOCAL ONLY. Never merge with the production Compose file.
# All credentials are generated fixture bindings; no app .env is inherited.
name: ${NEXUS_STAGING_PROJECT:?explicit disposable project required}
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus_staging_metadata
      POSTGRES_PASSWORD: ${NEXUS_STAGING_OPERATOR_PASSWORD:?generated local password required}
    volumes: ["postgres-state:/var/lib/postgresql/data"]
    # Deliberately no published port. The internal network denies provider egress.
    networks: [metadata]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    restart: "on-failure:2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus_staging_metadata"]
      interval: 2s
      timeout: 2s
      retries: 15
    logging: {driver: local, options: {max-size: "1m", max-file: "2"}}
  state-init:
    image: ${NEXUS_STAGING_WORKER_IMAGE:?verified code-only initializer image required}
    user: "0:0"
    entrypoint: ["python", "/app/ops/staging-initialize.py", "state"]
    environment:
      NEXUS_STAGING_UID: ${NEXUS_STAGING_UID:?image runtime uid required}
    volumes: ["api-state:/state/api", "research-state:/state/research", "shadow-state:/state/shadow", "datasets:/state/datasets"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    # One-shot preparation is bounded too; never share production state.
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: "no"
  metadata-init:
    image: ${NEXUS_STAGING_WORKER_IMAGE:?verified code-only initializer image required}
    entrypoint: ["python", "/app/ops/staging-initialize.py", "metadata"]
    environment:
      NEXUS_STAGING_OPERATOR_DSN: postgresql://postgres:${NEXUS_STAGING_OPERATOR_PASSWORD:?generated local password required}@postgres:5432/nexus_staging_metadata
      NEXUS_STAGING_RUNTIME_PASSWORD: ${NEXUS_STAGING_RUNTIME_PASSWORD:?generated runtime password required}
    depends_on: {postgres: {condition: service_healthy}}
    networks: [metadata]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: "no"
  api:
    image: ${NEXUS_STAGING_API_IMAGE:?verified local API image required}
    env_file: ${NEXUS_STAGING_APP_ENV:?generated local app bindings required}
    environment:
      HUB_ENV: production
      HUB_DATA_DIR: /var/lib/tradexa
      HUB_AUTO_ENGINE: "0"
      HUB_ENABLE_EXTERNAL_LIVE: "0"
      HUB_USE_LIVE_DATA: "0"
      HUB_RESEARCH_AUTOSTART: "0"
      HUB_MONITOR_AGENT: "0"
      HUB_DAILY_REPORT_HOUR: "-1"
      NEXUS_RESEARCH_WORKER_BACKEND: postgresql
      NEXUS_SHADOW_WORKER_BACKEND: postgresql
      NEXUS_RESEARCH_WORKER_DSN: postgresql://nexus_staging_worker:${NEXUS_STAGING_RUNTIME_PASSWORD:?generated runtime password required}@postgres:5432/nexus_staging_metadata
      NEXUS_SHADOW_WORKER_DSN: postgresql://nexus_staging_worker:${NEXUS_STAGING_RUNTIME_PASSWORD:?generated runtime password required}@postgres:5432/nexus_staging_metadata
      NEXUS_OPERATIONAL_SPOOL_PATH: /var/lib/tradexa/api-operational-spool.sqlite
      NEXUS_RESEARCH_HEALTH_FILE: /workers/research/research-health.json
      NEXUS_SHADOW_HEALTH_FILE: /workers/shadow/shadow-health.json
      NEXUS_SHADOW_SUPERVISED: ${NEXUS_STAGING_SHADOW_ENABLED:-0}
    depends_on: {metadata-init: {condition: service_completed_successfully}, state-init: {condition: service_completed_successfully}}
    volumes: ["api-state:/var/lib/tradexa", "research-state:/workers/research:ro", "shadow-state:/workers/shadow:ro", "datasets:/datasets:ro"]
    expose: ["8000"]
    networks: [metadata, ingress]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    restart: "on-failure:2"
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s
    logging: {driver: local, options: {max-size: "1m", max-file: "2"}}
  ingress:
    image: nginx:1.27-alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on: {api: {condition: service_healthy}}
    ports: ["127.0.0.1::8443"]
    volumes:
      - ./staging.nginx.conf:/etc/nginx/nginx.conf:ro
      - ${NEXUS_STAGING_TLS_DIR:?fresh local TLS fixture directory required}:/run/fixture:ro
    networks: [ingress]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 96m
    pids_limit: 32
    restart: "on-failure:2"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 2s
      timeout: 2s
      retries: 6
    logging: {driver: local, options: {max-size: "1m", max-file: "2"}}
  research-worker:
    image: ${NEXUS_STAGING_WORKER_IMAGE:?verified code-only worker image required}
    user: "${NEXUS_STAGING_UID:?image uid required}:${NEXUS_STAGING_UID:?image gid required}"
    init: true
    entrypoint: ["python", "-m", "services.research_worker_main"]
    command: ["--backend", "postgresql", "--health-file", "/observation/research-health.json"]
    environment:
      NEXUS_RESEARCH_WORKER_DSN: postgresql://nexus_staging_worker:${NEXUS_STAGING_RUNTIME_PASSWORD:?generated runtime password required}@postgres:5432/nexus_staging_metadata
      NEXUS_OPERATIONAL_SPOOL_PATH: /observation/research-operational-spool.sqlite
    depends_on: {metadata-init: {condition: service_completed_successfully}, state-init: {condition: service_completed_successfully}}
    volumes: ["research-state:/observation", "datasets:/datasets:ro"]
    networks: [metadata]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 64
    restart: "on-failure:2"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-m", "services.shadow_worker_health", "/observation/research-health.json"]
      interval: 2s
      timeout: 2s
      retries: 6
      start_period: 8s
    logging: {driver: local, options: {max-size: "1m", max-file: "2"}}
  shadow-worker:
    profiles: [shadow]
    image: ${NEXUS_STAGING_WORKER_IMAGE:?verified code-only worker image required}
    user: "${NEXUS_STAGING_UID:?image uid required}:${NEXUS_STAGING_UID:?image gid required}"
    init: true
    entrypoint: ["python", "-m", "services.shadow_worker_main"]
    command: ["--shadow-db", "/observation/unused-shadow.sqlite", "--journal-db", "/observation/unused-journal.sqlite", "--market-data-dir", "/observation/market", "--health-file", "/observation/shadow-health.json"]
    environment:
      NEXUS_RESEARCH_WORKER_BACKEND: postgresql
      NEXUS_SHADOW_WORKER_BACKEND: postgresql
      NEXUS_RESEARCH_WORKER_DSN: postgresql://nexus_staging_worker:${NEXUS_STAGING_RUNTIME_PASSWORD:?generated runtime password required}@postgres:5432/nexus_staging_metadata
      NEXUS_SHADOW_WORKER_DSN: postgresql://nexus_staging_worker:${NEXUS_STAGING_RUNTIME_PASSWORD:?generated runtime password required}@postgres:5432/nexus_staging_metadata
      NEXUS_OPERATIONAL_SPOOL_PATH: /observation/shadow-operational-spool.sqlite
    depends_on: {metadata-init: {condition: service_completed_successfully}, state-init: {condition: service_completed_successfully}}
    volumes: ["shadow-state:/observation", "datasets:/datasets:ro"]
    networks: [metadata]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 64
    restart: "on-failure:2"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-m", "services.shadow_worker_health", "/observation/shadow-health.json"]
      interval: 2s
      timeout: 2s
      retries: 6
      start_period: 8s
    logging: {driver: local, options: {max-size: "1m", max-file: "2"}}
networks:
  metadata: {internal: true}
  ingress: {}
volumes:
  postgres-state: {}
  api-state: {}
  research-state: {}
  shadow-state: {}
  datasets: {}
