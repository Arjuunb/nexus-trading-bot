# No DNS, firewall or existing certificate change. New isolated loopback ingress.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /run/fixture/tls.crt;
        ssl_certificate_key /run/fixture/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Only authentication and customer preference metadata may submit POST.
        # Financial/trading routes remain absent from this ingress allowlist.
        # Supabase-mode /login redirects to this read-only SPA shell.
        location = /auth/login {
            limit_except GET { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        # Only verified session creation/renewal may POST on these paths.
        location ~ ^/auth/supabase/(session|refresh)$ {
            limit_except POST { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        # Read-only profile inspection; PATCH and DELETE remain blocked.
        location = /auth/me {
            limit_except GET { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ~ ^/settings/(account|overview)$ {
            limit_except GET { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        # Dedicated customer preference metadata. Profile, engine, worker and
        # trading mutations remain outside this exact GET/POST allowlist.
        location = /user/settings {
            limit_except GET POST { deny all; }
            client_max_body_size 228k;
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Webhook-Secret "";
        }
        # These immutable static files are already public anonymously. Do not
        # pass customer credentials into the legacy-engine authorization path.
        location ^~ /assets/ {
            limit_except GET { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
        }
        location = /login {
            limit_except GET POST { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ~ ^/auth/(session|refresh|logout|two-factor)$ {
            limit_except GET POST { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ~ ^/(health$|version$|app(?:/|$)|assets/|api/v2/strategy-intelligence/) {
            limit_except GET { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = / {
            limit_except GET { deny all; }
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / { return 403; }
    }
}
