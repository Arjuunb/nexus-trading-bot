name: Publish exact scanned RC3 images to GHCR only

# The user separately authorized publication after reviewing successful build
# run 38767616216. No rebuild, VPS access, deployment or trading activation.
# Branch-scoped push starts this authorized publication without merging main.
on:
  push:
    branches: [ci/rc3-isolated-image-build]
    paths:
      - .github/rc3-publication/**
      - .github/workflows/rc3-publish-scanned-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc3-publish-scanned-build-38767616216
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ghcr-staging-release
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require the authorized isolated runner and first attempt
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = Arjuunb/nexus-trading-bot
          test "$GITHUB_REF" = refs/heads/ci/rc3-isolated-image-build
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          mkdir -p "$RUNNER_TEMP/rc3-publication-evidence"
          printf 'DOCKER_CONFIG=%s/rc3-ghcr-auth\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out publication controller separately from accepted images
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          sparse-checkout: .github/rc3-publication
      - name: Test publication guards before using registry credentials
        shell: bash
        run: python3 controller/.github/rc3-publication/test_publish.py
      - name: Download exact archives from successful build run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          repository: Arjuunb/nexus-trading-bot
          run-id: '38767616216'
          artifact-ids: '11989463144'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rc3-scanned-archives
          merge-multiple: true
      - name: Download original successful build and scan evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          repository: Arjuunb/nexus-trading-bot
          run-id: '38767616216'
          artifact-ids: '11989598060'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rc3-original-evidence
          merge-multiple: true
      - name: Reverify source, scan gates and every archived byte before authentication
        shell: bash
        run: |
          python3 controller/.github/rc3-publication/publish.py verify \
            --archives "$RUNNER_TEMP/rc3-scanned-archives" \
            --evidence "$RUNNER_TEMP/rc3-original-evidence" \
            --out "$RUNNER_TEMP/rc3-publication-evidence"
      - name: Authenticate only to GHCR using this workflow's scoped token
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -m 700 -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish unchanged scanned images and verify immutable registry references
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 controller/.github/rc3-publication/publish.py publish \
            --archives "$RUNNER_TEMP/rc3-scanned-archives" \
            --evidence "$RUNNER_TEMP/rc3-original-evidence" \
            --out "$RUNNER_TEMP/rc3-publication-evidence"
      - name: Remove disposable registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/rc3-ghcr-auth
        shell: bash
        run: |
          docker logout ghcr.io || true
          rm -rf -- "$RUNNER_TEMP/rc3-ghcr-auth"
      - name: Retain publication evidence including partial or failed outcomes
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rc3-ghcr-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc3-publication-evidence/
          if-no-files-found: error
          retention-days: 30
