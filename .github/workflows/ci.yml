name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  strategy-intelligence-dashboard:
    runs-on: ubuntu-latest
    env:
      HUB_AUTO_ENGINE: "0"
      HUB_ENABLE_EXTERNAL_LIVE: "0"
      HUB_USE_LIVE_DATA: "0"
      HUB_RESEARCH_AUTOSTART: "0"
      HUB_MONITOR_AGENT: "0"
      NEXUS_RESEARCH_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: automation-hub-dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated acceptance dependencies
        run: |
          pip install -e ".[dev]"
          pip install -r automation-hub/requirements.txt
      - name: Install dashboard and Chromium
        working-directory: automation-hub-dashboard
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Typecheck and build dashboard
        working-directory: automation-hub-dashboard
        run: npm run build:check
      - name: Verify strategy intelligence dashboard and real paper API
        working-directory: automation-hub-dashboard
        run: npm run test:e2e -- e2e/strategy-intelligence*.spec.ts e2e/strategy-monitoring.spec.ts e2e/strategy-research-decision.spec.ts

  landing-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tradexa-landing/package-lock.json

      - name: Install landing dependencies
        working-directory: tradexa-landing
        run: npm ci

      - name: Build and pre-render public routes
        working-directory: tradexa-landing
        run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r automation-hub/requirements.txt

      - name: Run engine test suite
        run: python -m pytest -q tests

      - name: Run automation-hub test suite
        working-directory: automation-hub
        run: python -m pytest -q

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python SDK
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip pytest
          pip install -e .
          python -m pytest -q tests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: TypeScript SDK
        working-directory: sdks/typescript
        run: |
          npm install
          npm test

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go SDK
        working-directory: sdks/go
        run: go vet ./... && go test ./...

      - name: Rust SDK
        working-directory: sdks/rust
        run: cargo test --quiet
