name: Verify staging SQLite backup helper on synthetic data

on:
  workflow_dispatch:
  push:
    branches: ['ops/staging-sqlite-backup-*']
    paths:
      - 'ops/backup-staging-sqlite-to-mac.py'
      - 'tests/test_staging_sqlite_to_mac.py'
      - '.github/workflows/staging-sqlite-backup-check.yml'

permissions:
  contents: read

jobs:
  synthetic-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install existing hash-locked test dependencies
        run: |
          python - <<'PY'
          import os,pathlib,re
          lock=pathlib.Path('ops/api-requirements.lock').read_text()
          blocks=re.split(r'\n(?=[a-zA-Z0-9])',lock)
          packaging=[b for b in blocks if b.startswith('packaging==')]
          assert len(packaging)==1 and '--hash=sha256:' in packaging[0]
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'backup-test-requirements.lock'
          target.write_text(pathlib.Path('ops/ci-test-requirements.lock').read_text()+'\n'+packaging[0]+'\n')
          PY
          python -m pip install --require-hashes -r "$RUNNER_TEMP/backup-test-requirements.lock"
          python -m pip check
      - name: Verify official native Linux tools in disposable CI storage
        run: |
          python - <<'PY'
          import hashlib, importlib.util, os, pathlib, urllib.request
          spec=importlib.util.spec_from_file_location('backup','ops/backup-staging-sqlite-to-mac.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'synthetic-sqlite-tools';root.mkdir(mode=0o700)
          with urllib.request.urlopen('https://sqlite.org/2026/'+m.LINUX_ZIP,timeout=30) as r:
              data=r.read(12*1024**2)
          tools=m.tools_from_zip(data,m.LINUX_ZIP)
          for name,key in [('sqlite3_rsync','linux_rsync'),('sqlite3','linux_sqlite')]:
              assert hashlib.sha256(tools[name]).hexdigest()==m.TOOL_SHA256[key]
              p=root/name;p.write_bytes(tools[name]);p.chmod(0o700)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('NEXUS_SYNTHETIC_SQLITE_TOOLS='+str(root)+'\n')
          PY
      - name: Exercise safety gates and actual WAL snapshot/restore protocol
        run: |
          python -m pytest -q tests/test_staging_sqlite_to_mac.py tests/test_pa_retirement_audit.py tests/test_pa_recovery_options_audit.py
