# Optional overlay only. It is never included by plain `docker compose up`.
# The operator must create GUARDIAN_DATA_PATH owned by UID/GID 10001 first.
services:
  guardian:
    image: nexus-trading-bot-guardian:${APP_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile.guardian
    env_file: .env.guardian
    environment:
      GUARDIAN_DB_PATH: /var/lib/guardian/evidence.db
      GUARDIAN_BIND_HOST: 0.0.0.0
      GUARDIAN_PORT: "8765"
      GUARDIAN_PUBLIC_STATUS_URL: http://app:8000/status/public
    volumes:
      - ${GUARDIAN_DATA_PATH:?Set an owner-only absolute Guardian data path}:/var/lib/guardian
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
