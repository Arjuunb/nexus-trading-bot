services:
  app:
    # Tagged with the revision it was built from. Without this the built image
    # inherits whatever tag the last build used, and a deploy can report
    # "Built nexus-trading-bot-app:main-21d232f" while actually containing a
    # different commit -- which it did. deploy.sh derives APP_IMAGE_TAG from
    # the checked-out revision and sanitises the branch name, because a git
    # branch may contain "/" and a Docker tag may not.
    image: nexus-trading-bot-app:${APP_IMAGE_TAG:-dev}
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        DEPLOYED_AT: ${DEPLOYED_AT:-unknown}
    env_file: .env
    environment:
      HUB_ENV: production
      HUB_DATA_DIR: /var/lib/tradexa
      # Shadow research opens three additional public Binance feeds. It is
      # opt-in so an unused observer cannot consume the VPS CPU budget.
      HUB_RESEARCH_AUTOSTART: "0"
      PORT: "8000"
      # Runtime metadata is explicit as well as baked into the image. This
      # prevents an empty value from env_file from masking the deployed build.
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      GIT_BRANCH: ${GIT_BRANCH:-unknown}
      DEPLOYED_AT: ${DEPLOYED_AT:-unknown}
    volumes:
      - tradexa-data:/var/lib/tradexa
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging:
      driver: local
      options: {max-size: "10m", max-file: "5"}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app: {condition: service_healthy}
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/entrypoint/10-render-config.sh:/docker-entrypoint.d/10-render-config.sh:ro
      - ./nginx/entrypoint/20-watch-cert-reload.sh:/docker-entrypoint.d/20-watch-cert-reload.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp, /etc/nginx/conf.d]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # The root master process must prepare the tmpfs-backed cache/PID paths,
    # bind 80/443, then drop privileges to the nginx worker user.  Retain the
    # drop-all baseline and grant only the capabilities required for that
    # initialization sequence.
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID, NET_BIND_SERVICE]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "5"}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Renewal is intentionally decoupled from the initial request. Nginx
    # watches the certificate mtime and reloads after a successful renewal.
    # A foreground sleep avoids Compose/shell escaping around "$!" waits.
    entrypoint: ["/bin/sh", "-c"]
    # Keep this as a one-element exec-form argument. Some Compose versions
    # split shell-form commands at semicolons, dropping the renewal loop.
    command:
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet || true
          sleep 43200
        done
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "5"}

volumes:
  tradexa-data:
  letsencrypt:
  certbot-webroot:
