[package]
name = "tradelogx-nexus"
version = "0.1.0"
edition = "2021"
description = "Client for the TradeLogX Nexus public API (/v1)"
license = "MIT"
publish = false

[dependencies]
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
