<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" />

    <title>TradeLogX Nexus | Trading Intelligence Platform</title>
    <meta
      name="description"
      content="TradeLogX Nexus combines market analysis, strategy testing, paper trading, risk controls, execution workflows and transparent decision records."
    />
    <meta name="application-name" content="TradeLogX Nexus" />
    <link rel="canonical" href="https://www.trade-logx.com/" />

    <!-- Favicons / app icons -->
    <link rel="icon" type="image/svg+xml" href="/nexus-mark-small.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TradeLogX Nexus" />
    <meta property="og:title" content="TradeLogX Nexus | Trading Intelligence Platform" />
    <meta
      property="og:description"
      content="Rule-based trading intelligence that shows its work: market-structure analysis, 0–100 setup scoring, enforced risk gates, backtesting and paper trading, with every decision journaled and explained."
    />
    <meta property="og:url" content="https://www.trade-logx.com/" />
    <meta property="og:image" content="https://www.trade-logx.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TradeLogX Nexus | Trading Intelligence Platform" />
    <meta
      name="twitter:description"
      content="Rule-based trading intelligence that shows its work: market-structure analysis, 0–100 setup scoring, enforced risk gates, backtesting and paper trading, with every decision journaled and explained."
    />
    <meta name="twitter:image" content="https://www.trade-logx.com/og-image.png" />

    <!--
      Structured data. Static rather than injected, because a crawler that does
      not execute the bundle still gets it — and this app renders entirely on
      the client, so anything added from React is invisible to some of them.
      Per-page BreadcrumbList is added at runtime on top of this.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "TradeLogX Nexus",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "url": "https://www.trade-logx.com/",
        "description": "Rule-based trading intelligence that shows its work: market-structure analysis, 0–100 setup scoring, enforced risk gates, backtesting and paper trading, with every decision journaled and explained.",
        "featureList": [
          "AI decision engine with written rationale for every trade",
          "Mandatory risk engine with veto power over every order",
          "Backtesting and walk-forward optimisation",
          "Paper trading against live market data",
          "Trading memory and performance attribution",
          "Envelope-encrypted, withdrawal-disabled exchange keys"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Boot shell.

      The bundle is ~400KB of React, framer-motion and router before the first
      component can render, and this document otherwise ships zero characters of
      content — so the browser had nothing to paint but a blank page, then the
      route fallback, and only then the site. This markup lives INSIDE #root, so
      React's first render replaces it automatically; no cleanup code, and no way
      for it to linger if the app fails to mount... except the noscript case
      below, which is the point.

      Inline styles only: a stylesheet is another round trip, and the whole
      purpose is to paint before anything else has arrived.
    -->
    <div id="root">
      <!-- nx-prerender:start -->
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0a0a0c;color:#E9EEF3;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
        <img src="/nexus-mark-small.svg" alt="" width="56" height="56" style="opacity:.9" />
        <div style="font-size:15px;letter-spacing:.02em;opacity:.75">TradeLogX Nexus</div>
        <div style="width:180px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden">
          <div style="width:40%;height:100%;background:linear-gradient(90deg,#8A929C,#E7C766);animation:nx-boot 1.1s ease-in-out infinite"></div>
        </div>
      </div>
      <!-- nx-prerender:end -->
    </div>
    <style>
      @keyframes nx-boot { 0% { transform: translateX(-100%) } 100% { transform: translateX(350%) } }
      @media (prefers-reduced-motion: reduce) { [style*="nx-boot"] { animation: none !important } }
    </style>
    <noscript>
      <div style="padding:24px;text-align:center;color:#E9EEF3;font-family:system-ui,sans-serif">
        TradeLogX Nexus needs JavaScript enabled to run.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
